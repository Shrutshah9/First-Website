
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found - Shrut</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b16;
            color: #eeeeF5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        h1 {
            font-size: clamp(90px, 20vw, 160px);
            color: #9b7bff;
            line-height: 1.2;
            text-shadow: 0 0 35px #7651dc77;
        }

        h2 {
            font-size: 30px;
            margin: 15px 0;
        }

        p {
            color: #aaaabd;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 13px 25px;
            background: linear-gradient(120deg, #7651dc, #4e7fe8);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>The page you're looking for doesn't exist or may have moved.</p>
        <a href="/First-Website/">Back to Home</a>
    </div>
</body>
</html>
